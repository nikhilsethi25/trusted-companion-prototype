<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Trusted Companion prototype</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="device">
    <div class="app" id="app">
      <header class="topbar">
        <div class="brand"><span class="spark" aria-hidden="true">✦</span> <span id="brand"></span></div>
        <div class="topbar-actions">
          <button type="button" class="demo-btn" id="demo-open"></button>
          <button type="button" id="reset" aria-label="Reset">↺</button>
        </div>
      </header>

      <div class="toast" id="toast" role="status" hidden></div>

      <main class="screen" id="screen"></main>

      <nav class="bottom-nav">
        <button type="button" data-screen="inbox"><span class="ico" aria-hidden="true">✉</span><span class="lbl"></span></button>
        <button type="button" data-screen="foryou"><span class="ico" aria-hidden="true">✦</span><span class="lbl"></span><span class="badge" hidden></span></button>
      </nav>

      <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
      <section class="sheet" id="demo-sheet" aria-hidden="true">
        <div class="sheet-head">
          <div class="sheet-title" id="demo-title"></div>
          <button type="button" class="sheet-close" id="demo-close" aria-label="Close">✕</button>
        </div>
        <div class="sheet-sub" id="demo-sub"></div>
        <div class="demo-body" id="demo-body"></div>
      </section>
    </div>
  </div>
  <p class="footnote" id="footnote"></p>
  <script src="app.js"></script>
</body>
</html>
